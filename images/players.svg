<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- my own drawing: three young people playing football together -->
  <defs>
    <clipPath id="frame">
      <rect width="600" height="400" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky, sun and clouds -->
    <rect width="600" height="400" fill="#DDF0F7"/>
    <circle cx="528" cy="66" r="30" fill="#F4A340"/>
    <g fill="#FFFFFF">
      <ellipse cx="110" cy="66" rx="46" ry="15"/>
      <ellipse cx="138" cy="54" rx="28" ry="17"/>
      <ellipse cx="372" cy="50" rx="40" ry="12"/>
      <ellipse cx="394" cy="40" rx="22" ry="13"/>
    </g>

    <!-- grass with stripes -->
    <rect y="238" width="600" height="162" fill="#2E9E5B"/>
    <g fill="#279253">
      <rect x="0" y="238" width="100" height="162"/>
      <rect x="200" y="238" width="100" height="162"/>
      <rect x="400" y="238" width="100" height="162"/>
    </g>
    <line x1="0" y1="378" x2="600" y2="378" stroke="#FFFFFF" stroke-width="5" opacity="0.85"/>

    <!-- goal net and posts -->
    <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.55">
      <line x1="58" y1="168" x2="58" y2="290"/>
      <line x1="80" y1="168" x2="80" y2="290"/>
      <line x1="102" y1="168" x2="102" y2="290"/>
      <line x1="124" y1="168" x2="124" y2="290"/>
      <line x1="146" y1="168" x2="146" y2="290"/>
      <line x1="36" y1="190" x2="168" y2="190"/>
      <line x1="36" y1="212" x2="168" y2="212"/>
      <line x1="36" y1="234" x2="168" y2="234"/>
      <line x1="36" y1="256" x2="168" y2="256"/>
      <line x1="36" y1="278" x2="168" y2="278"/>
    </g>
    <path d="M36 290 V168 H168 V290" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- cones -->
    <g>
      <polygon points="188,338 198,312 208,338" fill="#F4A340"/>
      <rect x="184" y="336" width="28" height="5" rx="2" fill="#E08E2B"/>
      <polygon points="548,338 558,312 568,338" fill="#F4A340"/>
      <rect x="544" y="336" width="28" height="5" rx="2" fill="#E08E2B"/>
    </g>

    <!-- goalkeeper with arms up -->
    <g>
      <ellipse cx="102" cy="292" rx="24" ry="5" fill="#000000" opacity="0.15"/>
      <line x1="95" y1="258" x2="90" y2="284" stroke="#F1C27D" stroke-width="10" stroke-linecap="round"/>
      <line x1="109" y1="258" x2="114" y2="284" stroke="#F1C27D" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="88" cy="288" rx="9" ry="5" fill="#142B40"/>
      <ellipse cx="116" cy="288" rx="9" ry="5" fill="#142B40"/>
      <line x1="90" y1="214" x2="70" y2="180" stroke="#F1C27D" stroke-width="9" stroke-linecap="round"/>
      <line x1="114" y1="214" x2="134" y2="180" stroke="#F1C27D" stroke-width="9" stroke-linecap="round"/>
      <circle cx="68" cy="176" r="8" fill="#F4A340"/>
      <circle cx="136" cy="176" r="8" fill="#F4A340"/>
      <rect x="88" y="246" width="28" height="14" rx="5" fill="#142B40"/>
      <rect x="86" y="206" width="32" height="46" rx="12" fill="#6C5CE7"/>
      <circle cx="102" cy="190" r="15" fill="#F1C27D"/>
      <path d="M86 190 Q86 172 102 172 Q118 172 118 190 Q110 182 102 183 Q94 182 86 190 Z" fill="#6B3E26"/>
      <circle cx="97" cy="191" r="1.8" fill="#142B40"/>
      <circle cx="107" cy="191" r="1.8" fill="#142B40"/>
      <path d="M97 197 Q102 201 107 197" fill="none" stroke="#142B40" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- player kicking the ball -->
    <g>
      <ellipse cx="280" cy="346" rx="46" ry="7" fill="#000000" opacity="0.15"/>
      <line x1="262" y1="286" x2="258" y2="336" stroke="#8D5524" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="254" cy="341" rx="13" ry="6" fill="#142B40"/>
      <line x1="282" y1="284" x2="320" y2="318" stroke="#8D5524" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="326" cy="322" rx="13" ry="6" fill="#142B40" transform="rotate(35 326 322)"/>
      <line x1="252" y1="218" x2="226" y2="252" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/>
      <line x1="288" y1="218" x2="316" y2="198" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/>
      <rect x="248" y="262" width="44" height="28" rx="8" fill="#142B40"/>
      <rect x="248" y="206" width="44" height="62" rx="15" fill="#F4A340"/>
      <text x="270" y="247" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#142B40" text-anchor="middle">7</text>
      <circle cx="270" cy="184" r="20" fill="#8D5524"/>
      <path d="M250 182 Q250 160 270 160 Q290 160 290 182 Q282 172 270 172 Q258 172 250 182 Z" fill="#1F1A17"/>
      <circle cx="263" cy="186" r="2.2" fill="#1F1A17"/>
      <circle cx="277" cy="186" r="2.2" fill="#1F1A17"/>
      <path d="M262 194 Q270 200 278 194" fill="none" stroke="#1F1A17" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- the ball and its path -->
    <path d="M368 312 Q404 286 428 296" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 9"/>
    <g>
      <circle cx="348" cy="322" r="15" fill="#FFFFFF" stroke="#142B40" stroke-width="2"/>
      <polygon points="348,316 353.7,320.1 351.5,326.9 344.5,326.9 342.3,320.1" fill="#142B40"/>
      <g stroke="#142B40" stroke-width="1.8" stroke-linecap="round">
        <line x1="348" y1="316" x2="348" y2="309"/>
        <line x1="353.7" y1="320.1" x2="360.4" y2="318"/>
        <line x1="351.5" y1="326.9" x2="355.6" y2="332.5"/>
        <line x1="344.5" y1="326.9" x2="340.4" y2="332.5"/>
        <line x1="342.3" y1="320.1" x2="335.6" y2="318"/>
      </g>
    </g>

    <!-- player waiting for the pass with arms open -->
    <g>
      <ellipse cx="455" cy="346" rx="36" ry="7" fill="#000000" opacity="0.15"/>
      <line x1="447" y1="280" x2="441" y2="336" stroke="#142B40" stroke-width="14" stroke-linecap="round"/>
      <line x1="463" y1="280" x2="469" y2="336" stroke="#142B40" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="437" cy="341" rx="12" ry="6" fill="#F4A340"/>
      <ellipse cx="473" cy="341" rx="12" ry="6" fill="#F4A340"/>
      <line x1="438" y1="222" x2="410" y2="194" stroke="#142B40" stroke-width="14" stroke-linecap="round"/>
      <line x1="438" y1="222" x2="410" y2="194" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <line x1="472" y1="222" x2="500" y2="194" stroke="#142B40" stroke-width="14" stroke-linecap="round"/>
      <line x1="472" y1="222" x2="500" y2="194" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="407" cy="191" r="6" fill="#C68642"/>
      <circle cx="503" cy="191" r="6" fill="#C68642"/>
      <rect x="435" y="212" width="40" height="64" rx="14" fill="#FFFFFF" stroke="#142B40" stroke-width="2"/>
      <rect x="451" y="213" width="8" height="62" fill="#16703C"/>
      <circle cx="455" cy="190" r="24" fill="#7B5EA7"/>
      <path d="M433 196 Q455 242 477 196 Z" fill="#7B5EA7"/>
      <ellipse cx="455" cy="191" rx="14" ry="16" fill="#C68642"/>
      <circle cx="450" cy="190" r="2" fill="#1F1A17"/>
      <circle cx="460" cy="190" r="2" fill="#1F1A17"/>
      <path d="M449 198 Q455 203 461 198" fill="none" stroke="#1F1A17" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
